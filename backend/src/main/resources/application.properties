# Onde está o banco (arquivo criado na pasta do projeto)
spring.datasource.url=jdbc:sqlite:sigaaspatinhas.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite só aceita uma escrita por vez: evita o erro "database is locked"
spring.datasource.hikari.maximum-pool-size=1

# Dialeto do SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Cria/atualiza as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update

# Mostra o SQL no console
spring.jpa.show-sql=true